root = "."
tmp_dir = "tmp"

[build]
  entrypoint = "./bin/quorant-worker"
  cmd = "go build -o ./bin/quorant-worker ./cmd/quorant-worker"
  delay = 1000
  exclude_dir = ["bin", "tmp", "migrations", "seeds", "cmd/quorant-api"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go"]
  kill_delay = "0s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = false
